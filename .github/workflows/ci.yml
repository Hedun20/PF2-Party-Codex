name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use pinned npm 11.9.0
        run: |
          npm install --global npm@11.9.0
          npm --version | grep --fixed-strings --line-regexp 11.9.0

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck framework-free contracts
        run: npm run typecheck

      - name: Verify strict target workspace boundaries
        run: npm run verify:target
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run runtime and dependency-boundary contract tests
        run: npm run test:contracts

      - name: Run adversarial security foundation
        run: npm run test:security

      - name: Run invitation and auth continuity contracts
        run: node --test tests/invitation-trust-flow-contracts.test.mjs tests/invitation-operations-contracts.test.mjs tests/auth-continuity-contracts.test.mjs
        env:
          AUTH_SECRET: ci-only-signing-secret-with-at-least-32-characters

      - name: Run route and access contracts
        run: node --test tests/route-contracts.test.mjs tests/campaign-context-resilience-contracts.test.mjs tests/portal-home-contracts.test.mjs tests/route-state-polish-contracts.test.mjs
        env:
          AUTH_SECRET: ci-only-signing-secret-with-at-least-32-characters

      - name: Run identity and session lifecycle contracts
        run: >-
          node --test
          tests/password-recovery-contracts.test.mjs
          tests/invitation-auth-return-contracts.test.mjs
          tests/invitation-acceptance-concurrency-contracts.test.mjs
          tests/membership-management-contracts.test.mjs
          tests/campaign-exit-contracts.test.mjs
          tests/campaign-ownership-transfer-contracts.test.mjs
          tests/discord-identity-contracts.test.mjs
          tests/session-lifecycle-contracts.test.mjs
          tests/player-management-ui-contracts.test.mjs
          tests/profile-preferences-contracts.test.mjs
        env:
          AUTH_SECRET: ci-only-signing-secret-with-at-least-32-characters

      - name: Build production web bundle and enforce budgets
        run: npm run build

      - name: Run server smoke tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/server-smoke.test.mjs 2>&1 | tee server-smoke.log
        env:
          AUTH_SECRET: ci-only-signing-secret-with-at-least-32-characters

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: server-smoke.log
          retention-days: 3

      - name: Run content, seed, dice, character editor and select contracts
        run: node --test tests/content-contracts.test.mjs tests/demo-seed-contracts.test.mjs tests/demo-targeting-contracts.test.mjs tests/dice-roll-contracts.test.mjs tests/character-editor-contracts.test.mjs tests/character-assignment-contracts.test.mjs tests/pf2-tactical-sheet-contracts.test.mjs tests/pf2-import-enrichment-contracts.test.mjs tests/select-archive-hotfix-contracts.test.mjs
        env:
          AUTH_SECRET: ci-only-signing-secret-with-at-least-32-characters

      - name: Check server and script syntax
        run: npm run check:syntax

      - name: Audit production dependencies
        run: npm run audit:production

  characterize-mongo:
    # GitHub-hosted runners now expose kernels that MongoDB 8.0 refuses to start on.
    # Keep the characterization on MongoDB 8.x, using 8.2 which is not affected by
    # the current 8.0/8.3 startup guard on these hosted kernels.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-only-signing-secret-with-at-least-32-characters
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB_NAME: pf2_party_codex_test_${{ github.run_id }}_${{ github.run_attempt }}
      PLATFORM_ADMIN_EMAILS: platform-admin@example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use pinned npm 11.9.0
        run: |
          npm install --global npm@11.9.0
          npm --version | grep --fixed-strings --line-regexp 11.9.0

      - name: Install locked dependencies
        run: npm ci

      - name: Characterize exact campaign access against disposable Mongo
        run: npm run test:repositories
